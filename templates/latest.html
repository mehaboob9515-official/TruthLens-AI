<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News - TruthLens AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1>📰 Latest News</h1>

    <div style="margin-bottom:30px;">

        <a href="/">
            <button>🏠 Home</button>
        </a>

        <a href="/dashboard">
            <button>📊 Dashboard</button>
        </a>

    </div>

    {% for news in news_list %}

    <div class="result-card" style="margin-bottom:20px;">

        <h3>{{ news.title }}</h3>

        <form action="/analyze_latest" method="POST" style="display:inline;">
    <input type="hidden" name="url" value="{{ news.link }}">
    <button type="submit" style="background:#16a34a;">
        🧠 Analyze
    </button>
</form>

<a href="{{ news.link }}" target="_blank">
    <button>
        🔗 Read Article
    </button>
</a>

    </div>

    {% endfor %}

</div>

</body>
</html>
